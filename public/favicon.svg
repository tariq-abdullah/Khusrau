<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="khBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2744"/>
      <stop offset="50%" stop-color="#091a30"/>
      <stop offset="100%" stop-color="#05101d"/>
    </linearGradient>
    <linearGradient id="khGold" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a17505"/>
    </linearGradient>
    <linearGradient id="khTextGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fce79a"/>
    </linearGradient>
    <filter id="khGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#d4af37" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background badge with gold rim -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#khBg)" stroke="url(#khGold)" stroke-width="2.6"/>
  <rect x="5.5" y="5.5" width="53" height="53" rx="10.5" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Urdu Calligraphy: خسرو -->
  <text x="32" y="34" font-family="'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', 'Geeza Pro', 'Traditional Arabic', serif" font-size="28" font-weight="bold" fill="url(#khTextGold)" text-anchor="middle" filter="url(#khGlow)">خسرو</text>

  <!-- Sub badge: 5.0 -->
  <rect x="18" y="44" width="28" height="13" rx="4" fill="#0c2340" stroke="#2563eb" stroke-width="0.8" stroke-opacity="0.7"/>
  <text x="32" y="53.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.8" fill="#60a5fa" text-anchor="middle">5.0</text>
</svg>
